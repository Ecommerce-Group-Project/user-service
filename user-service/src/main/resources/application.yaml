spring:
  application:
    name: user-service


  
  datasource:
    url: jdbc:h2:file:./db/user-service
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            # Spring listens to this exact URL by default to catch Google's redirect. Do not need to manually create
            # callback route like we do in node.js
            redirectUri: "{baseUrl}/login/oauth2/code/{registrationId}"

auth:
  token:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ttl-minutes: 1             # 15min
  cookie:
    name: access_token
    path: /
    ttl-minutes: 20160      # 14 days
    secure: false
    same-site: Lax

refresh:
  token:
    ttl-minutes: 20160          # 14 days
  cookie:
    name: refresh_token
    path: /api/auth
    ttl-minutes: 20160          # 14 days
    secure: false
    same-site: Lax

frontend:
  failure-redirect-url: "${FRONTEND_URL:http://localhost:8081}/login"
  success-redirect-url: "${FRONTEND_URL:http://localhost:8081}/"

cors:
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:8081}"